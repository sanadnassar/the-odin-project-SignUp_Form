<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cont">
        <div class="side">
            <img src="./img/image.jpg">
        </div>

        <div class="main">
            <div>
                <p>This is not a real online service! You know you need
                    something like this in your life to help you realize
                    your deepest dreams. Sign up <em>now</em> to get started.
                </p>
                <p>You <em>know</em> you want to.</p>

                <fieldset>
                    <p><Strong>Let's do this!</Strong></p>
                    <div class="box">
                        <div class="field-group">                        
                            <label for="name"><Strong>FIRST NAME:</Strong></label>
                            <input type="text" id="fname" name="name">
                        </div>

                        <div class="field-group">
                            <label for="name"><Strong>LAST NAME:</Strong></label>
                            <input type="text" id="lname" name="name">
                        </div>
                        
                        <div class="field-group">
                            <label for="email"><Strong>EMAIL:</Strong></label>
                            <input type="email" id="email" name="email">
                        </div>

                        <div class="field-group">
                            <label for="phone_number"><Strong>PHONE NUMBER:</Strong></label>
                            <input type="tel" id="phone_number" name="phone_number">
                        </div>

                        <div class="field-group">
                            <label for="name"><Strong>PASSWORD:</Strong></label>    
                            <input type="text" id="pass" name="name">
                        </div>

                        <div class="field-group">
                            <label for="name"><Strong>CONFIRM PASSWORD:</Strong></label>
                            <input type="text" id="cpass" name="name">
                        </div>
                    </div>
                </fieldset>
            </div>
        </div>
    </div>
</body>
</html>
